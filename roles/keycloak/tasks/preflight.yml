- name: Require an explicit secure service configuration
  ansible.builtin.assert:
    that:
      - keycloak_hostname is match('^https://[a-zA-Z0-9][a-zA-Z0-9.-]*(:[0-9]+)?$')
      - keycloak_directory is match('^/(opt|srv)/[a-zA-Z0-9_][a-zA-Z0-9_/-]*$')
      - keycloak_tls_directory is match('^/[a-zA-Z0-9_/-]+$')
      - keycloak_bind_address is match('^[0-9.]+$')
      - keycloak_https_port | int > 1024
      - keycloak_https_port | int < 65536
      - keycloak_admin_user is match('^[a-zA-Z0-9_-]+$')
      - keycloak_proxy_headers in ['', 'xforwarded']
      - keycloak_service_state in ['started', 'stopped']
      - "'@sha256:' in keycloak_image"
      - "'@sha256:' in keycloak_postgres_image"
    fail_msg: Configure the HTTPS origin, target TLS paths and pinned image digests before apply.

- name: Require distinct vault-managed service passwords
  ansible.builtin.assert:
    that:
      - keycloak_admin_password is match('^[a-zA-Z0-9]{32,128}$')
      - keycloak_database_password is match('^[a-zA-Z0-9]{32,128}$')
      - keycloak_admin_password != keycloak_database_password
    fail_msg: Set distinct keycloak_admin_password and keycloak_database_password in Ansible Vault using 32 to 128 letters and digits each.
  no_log: true
