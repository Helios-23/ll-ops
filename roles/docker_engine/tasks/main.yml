- name: Require a supported Docker apt platform
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_architecture in ['x86_64', 'aarch64', 'armv7l']
    fail_msg: This Docker Engine role currently supports Ubuntu on amd64, arm64 or armhf.

- name: Install prerequisites for Docker repo
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install the Docker official repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the Docker official apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: >-
      deb [arch={{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}[ansible_architecture] }}
      signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    owner: root
    group: root
    mode: "0644"

- name: Install Docker engine and compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Install Docker SDK for Python
  ansible.builtin.apt:
    name: python3-docker
    state: present

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
