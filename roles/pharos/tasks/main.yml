- name: Check which Pharos TLS certificates already exist per domain_list entry
  stat:
    path: /etc/letsencrypt/live/{{ item.name }}/fullchain.pem
  loop: "{{ domain_list }}"
  register: pharos_certbot_cert_results
  tags: pharos_domains

- name: Collect missing Pharos certificate domains from domain_list
  set_fact:
    pharos_certbot_domains: "{{ pharos_certbot_domains | default([]) + [item.item.name] }}"
  loop: "{{ pharos_certbot_cert_results.results }}"
  when: not item.stat.exists
  tags: pharos_domains

- name: Obtain missing Pharos TLS certificates with standalone certbot
  when: pharos_certbot_domains | default([]) | length > 0
  tags: pharos_domains
  block:
    - name: Stop nginx so standalone certbot can bind to port 80
      systemd:
        name: nginx
        state: stopped

    - name: Request Pharos TLS certificate with standalone certbot
      command:
        cmd: >-
          certbot certonly --standalone
          --non-interactive
          --agree-tos
          --email {{ pharos_certbot_email }}
          -d {{ item }}
          --keep-until-expiring
        creates: /etc/letsencrypt/live/{{ item }}/fullchain.pem
      loop: "{{ pharos_certbot_domains }}"
      register: pharos_certbot_result

  always:
    - name: Ensure nginx is started after standalone certbot attempt
      systemd:
        name: nginx
        state: started
        enabled: true

- name: Pharos nginx vhost
  tags:
    - pharos_nginx
  block:
    - name: Deploy nginx reverse proxy config for Pharos with TLS
      template:
        src: pharos_nginx.conf.j2
        dest: '/etc/nginx/sites-available/{{ pharos_domain }}.conf'
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Enable nginx Pharos site
      file:
        src: /etc/nginx/sites-available/{{ pharos_domain }}.conf
        dest: /etc/nginx/sites-enabled/{{ pharos_domain }}.conf
        state: link
      notify: Reload nginx

    - name: Test nginx configuration
      command: nginx -t
      changed_when: false

- name: Set up certbot auto-renewal cron job for Pharos
  cron:
    name: "certbot auto-renew pharos"
    job: "certbot renew --quiet --deploy-hook 'systemctl reload nginx'"
    minute: "15"
    hour: "3"
    state: present
