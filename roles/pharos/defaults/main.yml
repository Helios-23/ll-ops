pharos_domain: "{{ fqdn }}"
domain_list:
  - name: "{{ pharos_domain }}"
    root_url: "/dev_docs/"
  - name: "{{ domain }}"
    root_url: "/"
    legacy_root_url: "/llight"
    favicon_url: "/static/img/favicon.ico"
  - name: "www.{{ domain }}"
    root_url: "/"
    legacy_root_url: "/llight"
    favicon_url: "/static/img/favicon.ico"
pharos_use_socket: false
pharos_socket_path: "/run/pharos/pharos.sock"
pharos_service_host: "127.0.0.1"
pharos_service_port: 7323
pharos_access_log: "/var/log/nginx/pharos.access.log"
pharos_error_log: "/var/log/nginx/pharos.error.log"
pharos_certbot_email: "{{ admin_email | default('helios23@gmail.com') }}"
