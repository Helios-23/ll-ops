# Fail2ban settings
fail2ban_admin_email: "{{ admin_email }}"
fail2ban_feature_forgejo_enabled: false
forgejo_fail2ban_logpath: "{{ (forgejo_data_dir | default('/opt/forgejo/data')) ~ '/gitea/log/gitea.log' }}"
forgejo_fail2ban_logdir: "{{ (forgejo_data_dir | default('/opt/forgejo/data')) ~ '/gitea/log' }}"
forgejo_fail2ban_uid: 1000
forgejo_fail2ban_gid: 1000
forgejo_fail2ban_maxretry: 10
forgejo_fail2ban_findtime: 3600
forgejo_fail2ban_bantime: 900
fail2ban_feature_sshd_invalid_user_enabled: false
fail2ban_sshd_invalid_user_names:
  - root
  - user
  - admin
  - unknown
  - developer
fail2ban_sshd_invalid_user_logpath: "/var/log/auth.log"
fail2ban_sshd_invalid_user_maxretry: 1
fail2ban_sshd_invalid_user_findtime: 600
fail2ban_sshd_invalid_user_bantime: 43200
fail2ban_feature_reverse_proxy_enabled: false
reverse_proxy_fail2ban_logpath: "/var/log/nginx/access.log"
reverse_proxy_fail2ban_ports: "http,https"
reverse_proxy_fail2ban_statuses:
  - 401
  - 403
reverse_proxy_fail2ban_maxretry: 10
reverse_proxy_fail2ban_findtime: 600
reverse_proxy_fail2ban_bantime: 3600

# Users whose failed authentication attempts must NOT trigger fail2ban bans.
# Reuses allowed_ssh_users (defined by the harden role or inventory) so the
# list is not duplicated. This is useful when a legitimate user has many SSH
# keys loaded and sshd tries each of them in turn before the correct key is
# accepted (each "Failed publickey" line would otherwise count against
# fail2ban's maxretry and ban the IP). Override to use a different/broader
# exemption list.
fail2ban_whitelisted_users: "{{ allowed_ssh_users | default([]) }}"
