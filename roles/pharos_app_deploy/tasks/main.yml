- name: Host Archive Prep
  block:
    - name: Ensure Pharos app release artifact root exists on controller
      file:
        path: "{{ pharos_app_deploy_controller_release_root }}"
        state: directory
        mode: "{{ pharos_app_deploy_directory_mode }}"

    - name: Sync Pharos repo on controller
      git:
        repo: "{{ pharos_app_deploy_repo_url }}"
        dest: "{{ pharos_app_deploy_repo_dir }}"
        version: "{{ pharos_app_deploy_repo_version }}"
        update: true
        force: true
      when: update_repo

    - name: Generate Pharos app archive stamp on controller
      set_fact:
        pharos_app_deploy_archive_stamp: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

    - name: Check for existing host-native Pharos CLI for app packaging
      ansible.builtin.stat:
        path: "{{ pharos_app_deploy_repo_dir }}/bin/pharos"
      register: pharos_app_deploy_cli_bin

    - name: Check whether existing host-native Pharos CLI is runnable for app packaging
      ansible.builtin.command: bin/pharos --version
      args:
        chdir: "{{ pharos_app_deploy_repo_dir }}"
      register: pharos_app_deploy_cli_version_check
      changed_when: false
      failed_when: false
      when: pharos_app_deploy_cli_bin.stat.exists

    - name: Install host-native Pharos CLI for app packaging when missing
      ansible.builtin.command:
        cmd: sh scripts/build_native.sh install
        chdir: "{{ pharos_app_deploy_repo_dir }}"
      when: >-
        (not pharos_app_deploy_cli_bin.stat.exists)
        or ((pharos_app_deploy_cli_version_check.rc | default(1)) != 0)

    - name: Compute docs-renderer binary fingerprint for dev_docs app packaging
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/bin/compute_pharos_docs_renderer_fingerprint.py"
          - "{{ pharos_app_deploy_repo_dir }}"
      args:
        chdir: "{{ playbook_dir }}"
      register: pharos_app_deploy_docs_renderer_fingerprint
      changed_when: false
      when: app_id == 'dev_docs'

    - name: Check saved docs-renderer fingerprint for dev_docs app packaging
      ansible.builtin.stat:
        path: "{{ pharos_app_deploy_repo_dir }}/dist/.dev_docs_renderer_fingerprint"
      register: pharos_app_deploy_docs_renderer_fingerprint_file
      when: app_id == 'dev_docs'

    - name: Read saved docs-renderer fingerprint for dev_docs app packaging
      ansible.builtin.slurp:
        path: "{{ pharos_app_deploy_repo_dir }}/dist/.dev_docs_renderer_fingerprint"
      register: pharos_app_deploy_saved_docs_renderer_fingerprint_raw
      when:
        - app_id == 'dev_docs'
        - pharos_app_deploy_docs_renderer_fingerprint_file.stat.exists

    - name: Decide whether host-native Pharos docs renderer must rebuild for dev_docs app packaging
      ansible.builtin.set_fact:
        pharos_app_deploy_rebuild_docs_renderer: >-
          {{
            (
              (pharos_app_deploy_docs_renderer_fingerprint.stdout | trim)
              !=
              (
                (pharos_app_deploy_saved_docs_renderer_fingerprint_raw.content | b64decode | trim)
                if pharos_app_deploy_docs_renderer_fingerprint_file.stat.exists
                else ''
              )
            )
          }}
      when: app_id == 'dev_docs'

    - name: Install host-native Pharos docs renderer for dev_docs app packaging
      ansible.builtin.command:
        cmd: sh scripts/build_native.sh install
        chdir: "{{ pharos_app_deploy_repo_dir }}"
      when:
        - app_id == 'dev_docs'
        - pharos_app_deploy_rebuild_docs_renderer

    - name: Save current docs-renderer fingerprint after dev_docs app-packaging rebuild
      ansible.builtin.copy:
        dest: "{{ pharos_app_deploy_repo_dir }}/dist/.dev_docs_renderer_fingerprint"
        content: "{{ pharos_app_deploy_docs_renderer_fingerprint.stdout | trim }}\n"
        mode: "0644"
      when:
        - app_id == 'dev_docs'
        - pharos_app_deploy_rebuild_docs_renderer

    - name: Show docs renderer reuse decision for dev_docs app packaging
      ansible.builtin.debug:
        msg: >-
          {{
            'Rebuilt host-native Pharos docs renderer for dev_docs app packaging.'
            if pharos_app_deploy_rebuild_docs_renderer
            else 'Reusing existing host-native Pharos docs renderer for dev_docs app packaging.'
          }}
      when: app_id == 'dev_docs'

    - name: Set --clean based on CLI parameter
      set_fact:
        dist_clean: "--clean"
      when: clean_dist

    - name: Prebuild packaged dev_docs artifact on host
      ansible.builtin.command:
        cmd: bin/pharos build app dev_docs --build-dir dist --text
        chdir: "{{ pharos_app_deploy_repo_dir }}"
      when: app_id == 'dev_docs'


    - name: Render finalized {{ app_id }} app root on controller before packaging
      ansible.builtin.command:
        cmd: >-
          bin/pharos build app {{ app_id }} {{ dist_clean }} --packaging
        chdir: "{{ pharos_app_deploy_repo_dir }}"

    - name: Verify finalized {{ app_id }} app root exists on controller
      ansible.builtin.stat:
        path: "{{ pharos_app_deploy_controller_app_root }}/pharos.app.json"
      register: pharos_app_deploy_controller_manifest

    - name: Verify finalized {{ app_id }} runtime configuration exists on controller
      ansible.builtin.stat:
        path: "{{ pharos_app_deploy_controller_app_root }}/app.conf"
      register: pharos_app_deploy_controller_config

    - name: Fail when finalized {{ app_id }} app root was not emitted on controller
      ansible.builtin.fail:
        msg: >-
          expected finalized app root at {{ pharos_app_deploy_controller_app_root }} but pharos.app.json or app.conf was not emitted
      when: >-
        not pharos_app_deploy_controller_manifest.stat.exists
        or not pharos_app_deploy_controller_config.stat.exists

    - name: Package finalized Pharos app root archive on controller
      shell: |
        set -eu
        umask 022
        archive_source_dir="{{ pharos_app_deploy_controller_app_root }}"
        archive_path="{{ pharos_app_deploy_archive_path }}"
        tar_args=''
        {% for prefix in pharos_app_deploy_bundle_exclude_prefixes %}
        tar_args="$tar_args --exclude={{ prefix }}"
        {% endfor %}
        {% for exact_path in pharos_app_deploy_bundle_exclude_exact_paths %}
        tar_args="$tar_args --exclude={{ exact_path }}"
        {% endfor %}
        {% for name in pharos_app_deploy_bundle_exclude_names %}
        tar_args="$tar_args --exclude={{ name }}"
        {% endfor %}
        {% for suffix in pharos_app_deploy_bundle_exclude_suffixes %}
        tar_args="$tar_args --exclude=*{{ suffix }}"
        {% endfor %}
        # shellcheck disable=SC2086
        tar -C "$archive_source_dir" $tar_args -czf "$archive_path" .
      args:
        executable: /bin/sh

  delegate_to: localhost
  become: false
  run_once: true
## END Host Archive Prep

- name: Ensure Pharos app directories exist on target host
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pharos_app_deploy_owner }}"
    group: "{{ pharos_app_deploy_group }}"
    mode: "{{ pharos_app_deploy_directory_mode }}"
  loop:
    - "{{ pharos_app_deploy_remote_root }}"
    - "{{ pharos_app_deploy_remote_app_dir }}"

- name: Stage {{ app_id }} bundle in ll_repo
  vars:
    ll_repo_artifact_src: "{{ pharos_app_deploy_archive_path }}"
    ll_repo_type: app
  import_role: { name: ll_repo }

- name: Optionally clean Pharos app directory on target host before extraction
  shell: |
    set -eu
    app_dir="{{ pharos_app_deploy_remote_app_dir }}"
    find "$app_dir" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
  args:
    executable: /bin/sh
  when: clean_dest | bool

- name: Extract Pharos app bundle on target host
  unarchive:
    src: "{{ ll_repo }}/{{ pharos_app_deploy_archive_basename }}"
    dest: "{{ pharos_app_deploy_remote_app_dir }}"
    remote_src: true
    owner: "{{ pharos_app_deploy_owner }}"
    group: "{{ pharos_app_deploy_group }}"
    extra_opts:
      - --no-same-owner
  register: pharos_app_deploy_extract
  notify: Restart Pharos services

- name: Secure deployed {{ app_id }} runtime configuration
  ansible.builtin.file:
    path: "{{ pharos_app_deploy_remote_app_dir }}/app.conf"
    state: file
    owner: "{{ pharos_app_deploy_owner }}"
    group: "{{ pharos_app_deploy_group }}"
    mode: "0640"

- name: Read deployed {{ app_id }} packaged manifest
  ansible.builtin.slurp:
    path: "{{ pharos_app_deploy_remote_app_dir }}/pharos.app.json"
  register: pharos_app_deploy_manifest_raw

- name: Parse deployed {{ app_id }} packaged manifest
  ansible.builtin.set_fact:
    pharos_app_deploy_manifest: >-
      {{ pharos_app_deploy_manifest_raw.content | b64decode | from_json }}

- name: Read deployed {{ app_id }} runtime app config
  ansible.builtin.slurp:
    path: "{{ pharos_app_deploy_remote_app_dir }}/app.conf"
  register: pharos_app_deploy_app_conf_raw
  when: pharos_app_deploy_manifest.host_profile | default('') == 'dynamic-app'

- name: Derive deployed {{ app_id }} runtime backend
  ansible.builtin.set_fact:
    pharos_app_deploy_runtime_backend: >-
      {{
        (
          pharos_app_deploy_app_conf_raw.content
          | b64decode
          | regex_search('(?m)^db_backend=([^\\n]+)$', '\\1')
          | first
        )
        | default('sqlite', true)
        | trim
      }}
  when: pharos_app_deploy_manifest.host_profile | default('') == 'dynamic-app'

- name: Apply deployed {{ app_id }} migrations for dynamic app runtime
  ansible.builtin.command:
    argv:
      - "{{ pharos_app_deploy_runtime_binary_path }}"
      - migrate
      - apply
      - app
      - "{{ app_id }}"
      - --conf
      - "{{ pharos_app_deploy_runtime_conf_path }}"
      - --app-dir
      - "{{ pharos_app_deploy_remote_app_dir }}"
      - --backend
      - "{{ pharos_app_deploy_runtime_backend }}"
  environment:
    PHAROS_CONFIG: "{{ pharos_app_deploy_runtime_conf_path }}"
  become: true
  become_user: "{{ pharos_app_deploy_owner }}"
  register: pharos_app_deploy_migrate_apply
  changed_when: false
  when: pharos_app_deploy_manifest.host_profile | default('') == 'dynamic-app'

- name: Verify deployed {{ app_id }} packaged manifest exists and preserves relocatable app_root
  ansible.builtin.shell: |
    set -eu
    manifest_path="{{ pharos_app_deploy_remote_app_dir }}/pharos.app.json"
    relocatable_pattern='"app_root"[[:space:]]*:[[:space:]]*"\."'
    [ -f "$manifest_path" ]
    grep -E "$relocatable_pattern" "$manifest_path" >/dev/null
  args:
    executable: /bin/sh
  become: true

- name: Prune older {{ app_id }} bundles
  vars:
    ll_repo_type: app
    ll_repo_keep: 2
  import_role:
    name: ll_repo
    tasks_from: prune
  when: pharos_app_deploy_extract is succeeded
