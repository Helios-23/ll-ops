- name: Resolve Pharos package source from build output
  set_fact:
    pharos_deploy_package_src: >-
      {{
        hostvars['localhost']['pharos_deploy_package_src']
        | default(pharos_deploy_package_src | default(''))
      }}

- name: Find latest Pharos package on controller when source is unspecified
  delegate_to: localhost
  become: false
  find:
    paths: "{{ pharos_build_package_dir }}"
    patterns: "{{ pharos_deploy_package_glob }}"
    file_type: file
  register: pharos_deploy_package_find
  when: pharos_deploy_package_src == ""
  run_once: true

- name: Select latest Pharos package on controller when source is unspecified
  delegate_to: localhost
  become: false
  set_fact:
    pharos_deploy_package_src: >-
      {{
        (pharos_deploy_package_find.files
        | sort(attribute='mtime', reverse=true)
        | first).path
        if pharos_deploy_package_find.matched | int > 0
        else ''
      }}
  when: pharos_deploy_package_src == ""
  run_once: true

- name: Fail when Pharos package source cannot be resolved
  fail:
    msg: >-
      Pharos package source could not be resolved. Build it with
      build.yml -t pharos_build or pass pharos_deploy_package_src
      explicitly.
  when: pharos_deploy_package_src == ""

- name: Stage Pharos runtime package in ll_repo
  vars:
    ll_repo_artifact_src: "{{ pharos_deploy_package_src }}"
  import_role: { name: ll_repo }

- name: Ensure Pharos systemd override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/pharos.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Make the Pharos runtime socket inherit the nginx group after every restart
  ansible.builtin.copy:
    dest: /etc/systemd/system/pharos.service.d/socket-policy.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      UMask=0007
      ExecStartPre=
      ExecStartPre=/usr/bin/install -d -o pharos -g www-data -m 2750 /run/pharos
  notify: Restart Pharos services

- name: Install Pharos package from staged repository
  shell: |
    set -e
    deb="{{ ll_repo }}/$(ls -1t {{ ll_repo }}/pharos_*.deb | head -1 | xargs -n1 basename)"
    dpkg --force-confnew -i "$deb" || (apt-get -f install -y && dpkg --force-confnew -i "$deb")
  args:
    executable: /bin/sh
  register: pharos_deploy_install
  notify: Restart Pharos services

- name: Update configuration to enalble smtp email
  ansible.builtin.lineinfile:
    path: /etc/pharos/{{ item.fname }}
    regexp: "{{ item.regexp }}"
    line: "{{ item.new_line }}"
    state: present
  loop:
    - { fname: 'pharos.conf', regexp: '^#?\s*base_url=app.example.com', new_line: 'base_url={{ fqdn }}' }
    - { fname: 'pharos.conf', regexp: '^#?\s*smtp_server=<your_smtp_server>', new_line: 'smtp_server={{ smtp_server }}' }
    - { fname: 'pharos.conf', regexp: '^#?\s*smtp_port=587', new_line: 'smtp_port=587' }
    - { fname: 'pharos.conf', regexp: '^#?\s*smtp_mail_from=noreply@example.com', new_line: 'smtp_mail_from={{ smtp_mail_from }}' }
    - { fname: 'pharos.conf', regexp: '^#?\s*smtp_login=<your_smtp_login>', new_line: 'smtp_login={{ smtp_login }}' }
    - { fname: 'pharos.conf', regexp: '^#?\s*smtp_pass=PHAROS_SMTP_PASS', new_line: 'smtp_pass=PHAROS_SMTP_PASS' }
    - { fname: 'pharos.conf', regexp: '^#?\s*smtp_encryption=STARTTLS', new_line: 'smtp_encryption=STARTTLS' }
    - { fname: 'pharos.conf', regexp: '^#?\s*smtp_timeout_seconds=15', new_line: 'smtp_timeout_seconds=15' }
    - { fname: 'pharos.conf', regexp: '^#?\s*smtp_max_message_bytes=1048576', new_line: 'smtp_max_message_bytes=1048576' }
    - { fname: 'pharos.env', regexp: 'PHAROS_SMTP_PASS=', new_line: 'PHAROS_SMTP_PASS={{ smtp_pass }}' }
  no_log: true

- name: Restrict Pharos environment secrets to the service account
  ansible.builtin.file:
    path: /etc/pharos/pharos.env
    state: file
    owner: "{{ pharos_deploy_owner }}"
    group: "{{ pharos_deploy_group }}"
    mode: '0640'

- name: Find bundled packaged app manifests installed by the runtime package
  ansible.builtin.find:
    paths: /srv/pharos/apps
    patterns: pharos.app.json
    file_type: file
    recurse: true
  register: pharos_deploy_packaged_manifests

- name: Read bundled packaged app manifests installed by the runtime package
  ansible.builtin.slurp:
    path: "{{ item.path }}"
  loop: "{{ pharos_deploy_packaged_manifests.files }}"
  register: pharos_deploy_packaged_manifest_raw

- name: Build bundled packaged app metadata for post-install migration
  ansible.builtin.set_fact:
    pharos_deploy_packaged_apps: "{{ (pharos_deploy_packaged_apps | default([])) + [ {'app_id': parsed_manifest.app_id, 'host_profile': (parsed_manifest.host_profile | default(parsed_manifest.runtime.host_profile | default(''))), 'app_dir': (item.item.path | dirname)} ] }}"
  vars:
    parsed_manifest: "{{ item.content | b64decode | from_json }}"
  loop: "{{ pharos_deploy_packaged_manifest_raw.results }}"

- name: Select bundled dynamic apps that require migration
  ansible.builtin.set_fact:
    pharos_deploy_dynamic_apps: >-
      {{
        (pharos_deploy_packaged_apps | default([]))
        | selectattr('host_profile', 'equalto', 'dynamic-app')
        | list
      }}

- name: Stop shared runtime services before bundled dynamic-app migrations
  ansible.builtin.systemd:
    name: "{{ item }}"
    daemon_reload: true
    state: stopped
  loop: "{{ pharos_deploy_services }}"
  when: (pharos_deploy_dynamic_apps | default([]) | length) > 0

- name: Read bundled dynamic-app configs after shared runtime stop
  ansible.builtin.slurp:
    path: "{{ item.app_dir }}/app.conf"
  loop: "{{ pharos_deploy_dynamic_apps | default([]) }}"
  register: pharos_deploy_packaged_app_conf_raw

- name: Apply bundled dynamic-app migrations while shared runtime is stopped
  ansible.builtin.command:
    argv:
      - /usr/bin/pharos
      - migrate
      - apply
      - app
      - "{{ item.item.app_id }}"
      - --conf
      - /etc/pharos/pharos.conf
      - --app-dir
      - "{{ item.item.app_dir }}"
      - --backend
      - "{{ ((item.content | b64decode).splitlines() | select('match', '^db_backend=') | map('regex_replace', '^db_backend=', '') | list | first | default('sqlite')) }}"
  environment:
    PHAROS_CONFIG: /etc/pharos/pharos.conf
  become_user: "{{ pharos_deploy_owner }}"
  loop: "{{ pharos_deploy_packaged_app_conf_raw.results | default([]) }}"
  when:
    - item.skipped is not defined or not item.skipped
  notify: Restart Pharos services

- name: Prune older Pharos runtime packages
  vars:
    ll_repo_type: pack
    ll_repo_keep: 2
  import_role:
    name: ll_repo
    tasks_from: prune
  when: pharos_deploy_install is succeeded
