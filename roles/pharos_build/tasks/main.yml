- name: Pharos build role
  tags: pharos_build
  block:
    - name: Validate Pharos build target
      fail:
        msg: >-
          Unknown Pharos build target '{{ pharos_build_target }}'.
          Valid: all, or one of {{ pharos_build_known_targets | join(', ') }}.
      when:
        - pharos_build_target != 'all'
        - pharos_build_target not in pharos_build_known_targets

    - name: Fail fast on known-broken Pharos build targets
      fail:
        msg: >-
          Pharos build target '{{ pharos_build_target }}' is temporarily disabled in ops.
          The current cross image ships an invalid macOS PostgreSQL archive under
          /opt/pharos-db/postgresql/macos-universal/lib/libpq.a, where libpq.a contains
          ELF x86_64 objects instead of Mach-O objects, so the macos-universal build fails.
          The default all-target build now skips macos-universal until that cross image is fixed.
      when:
        - pharos_build_target != 'all'
        - pharos_build_target in pharos_build_disabled_targets

    # Repo Clone
    - name: Create Pharos build output directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ pharos_build_binary_dir }}"
        - "{{ pharos_build_package_dir }}"

    - name: Clone or update Pharos repository
      ansible.builtin.git:
        repo: "git@github.com:Helios-23/pharos.git"
        dest: "{{ pharos_build_repo_dir }}"
        version: main
        update: yes
      register: pharos_build_pharos_pull
      when: update_repo

    - name: Clean repo-local Zig tool directory for platform-agnostic Docker builds
      file:
        path: "{{ pharos_build_repo_dir }}/.deps/zig"
        state: absent

    - name: Check current Pharos VERSION file
      ansible.builtin.stat:
        path: "{{ pharos_build_repo_dir }}/VERSION"
      register: pharos_build_version_file

    - name: Read current Pharos VERSION file
      ansible.builtin.slurp:
        path: "{{ pharos_build_repo_dir }}/VERSION"
      register: pharos_build_current_version_raw
      when: pharos_build_version_file.stat.exists

    - name: Check current Pharos Cargo workspace manifest
      ansible.builtin.stat:
        path: "{{ pharos_build_repo_dir }}/Cargo.toml"
      register: pharos_build_manifest_file

    - name: Read current Pharos Cargo workspace manifest
      ansible.builtin.slurp:
        path: "{{ pharos_build_repo_dir }}/Cargo.toml"
      register: pharos_build_manifest_raw
      when: pharos_build_manifest_file.stat.exists

    - name: Set raw Pharos version surfaces for build
      ansible.builtin.set_fact:
        pharos_build_manifest_text: >-
          {{
            (pharos_build_manifest_raw.content | b64decode)
            if pharos_build_manifest_file.stat.exists
            else ''
          }}
        pharos_build_version_file_text: >-
          {{
            (pharos_build_current_version_raw.content | b64decode | trim)
            if pharos_build_version_file.stat.exists
            else ''
          }}
        pharos_build_requested_version: "{{ pharos_build_release_version | trim }}"

    - name: Resolve current Pharos workspace version from Cargo manifest
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import pathlib
            import tomllib
            manifest = pathlib.Path(r"{{ pharos_build_repo_dir }}/Cargo.toml").read_text()
            print(tomllib.loads(manifest)["workspace"]["package"]["version"])
      register: pharos_build_manifest_version_cmd
      changed_when: false

    - name: Set resolved current Pharos workspace version for build
      ansible.builtin.set_fact:
        pharos_build_current_version: "{{ pharos_build_manifest_version_cmd.stdout | trim }}"

    - name: Fail when Pharos workspace version cannot be resolved
      fail:
        msg: >-
          Could not resolve the current Pharos version from
          {{ pharos_build_repo_dir }}/Cargo.toml [workspace.package].version.
      when: pharos_build_current_version | length == 0

    - name: Fail when Pharos VERSION and Cargo workspace version are out of sync
      fail:
        msg: >-
          Pharos version mismatch detected.
          VERSION={{ pharos_build_version_file_text | default('') }}
          Cargo.toml={{ pharos_build_current_version }}.
          Sync both surfaces before building.
      when:
        - pharos_build_version_file.stat.exists
        - pharos_build_version_file_text | length > 0
        - pharos_build_version_file_text != pharos_build_current_version

    - name: Create or sync Pharos VERSION file from workspace version when missing
      ansible.builtin.copy:
        dest: "{{ pharos_build_repo_dir }}/VERSION"
        content: "{{ pharos_build_current_version }}\n"
        mode: "0644"
      when:
        - not pharos_build_version_file.stat.exists or pharos_build_version_file_text | length == 0

    - name: Bump Pharos VERSION file from ops build setting when newer
      ansible.builtin.copy:
        dest: "{{ pharos_build_repo_dir }}/VERSION"
        content: "{{ pharos_build_requested_version }}\n"
        mode: "0644"
      when:
        - pharos_build_requested_version | length > 0
        - pharos_build_requested_version is version(pharos_build_current_version, '>')

    - name: Bump Pharos Cargo workspace version from ops build setting when newer
      ansible.builtin.replace:
        path: "{{ pharos_build_repo_dir }}/Cargo.toml"
        regexp: '(?ms)(^\\[workspace\\.package\\]\\s*$.*?^version\\s*=\\s*")[^"]+(")'
        replace: '\g<1>{{ pharos_build_requested_version }}\2'
      when:
        - pharos_build_requested_version | length > 0
        - pharos_build_requested_version is version(pharos_build_current_version, '>')

    - name: Set --clean based on CLI parameter
      set_fact:
        release_flag: "--release"
      when: release | bool

    - name: Capture pre-build checksums
      shell: |
        find {{ pharos_build_package_dir }} -type f \( -name "*.apk" -o -name "*.deb" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.msix" -o -name "*.rpm" -o -name "*.pkg" -o -name "*.pkg.tar.zst" -o -name "*.ebuild" -o -name "*.rb" \) -exec shasum -a 256 {} + > {{ pharos_build_binary_dir }}/pre_build_hashes.txt
      register: pre_build_hashes

    # Docker Compose orchestration
    - name: Build ALL Pharos targets in parallel via Docker Compose
      command: docker compose --profile all up
      args:
        chdir: "{{ pharos_build_compose_dir }}"
      register: pharos_build_compose_up
      when: pharos_build_target == 'all'

    - name: Clean up Pharos compose resources
      command: docker compose down --remove-orphans
      args:
        chdir: "{{ pharos_build_compose_dir }}"
      when: pharos_build_target == 'all'

    - name: Build single Pharos target sequentially
      command: docker compose run --rm -T --remove-orphans {{ item }}
      args:
        chdir: "{{ pharos_build_compose_dir }}"
      loop: "{{ pharos_build_selected_targets }}"
      when: pharos_build_target != 'all'

    # Verification
    - name: Find all files in the output directory
      ansible.builtin.find:
        paths: "{{ pharos_build_package_dir }}"
        patterns: "{{ pharos_build_release_artifacts }}"
        file_type: file
      register: found_files

    - name: Identify files with updated checksums
      shell: |
        changed_list=""
        for file in {{ found_files.files | map(attribute='path') | join(' ') }}; do
          current_hash=$(shasum -a 256 "$file" | awk '{print $1}')
          if ! grep -q "$current_hash" {{ pharos_build_binary_dir }}/pre_build_hashes.txt; then
            changed_list="$changed_list $file"
          fi
        done
        echo $changed_list
      register: checksum_verification

    - name: Set changed files fact
      ansible.builtin.set_fact:
        changed_files: "{{ checksum_verification.stdout.split() }}"

    - name: Show packaged artifacts from this run
      ansible.builtin.debug:
        msg: |
          Packaged artifacts:
          {% for file in changed_files %}
          {{ file }}
          {% endfor %}

    - name: Cleanup checksum snapshots
      ansible.builtin.file:
        path: "{{ pharos_build_binary_dir }}/pre_build_hashes.txt"
        state: absent
