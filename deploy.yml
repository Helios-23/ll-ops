- name: Configure Proof local-runner execution boundary
  hosts: web0
  become: true
  gather_facts: false
  tags:
    - pharos_proof_worker
  tasks:
    - name: Retire server-side source copies and preserve generated evidence
      ansible.builtin.import_role:
        name: pharos_app_deploy
        tasks_from: proof_worker.yml

- name: Deploy Pharos runtime package
  hosts: web0
  become: true
  gather_facts: false
  tags:
    - pharos_runtime
  roles:
    - role: pharos_deploy
      tags: pharos_runtime

- name: Deploy Pharos app bundle
  hosts: web0
  become: true
  gather_facts: false
  tags:
    - pharos_app
  vars:
    app_id: ucal
    clean_dest: false
    clean_dist: false
    # Update repositories on the controller before building when true
    update_repo: false
  roles:
    - role: pharos_app_deploy
      tags:
        - pharos_app
