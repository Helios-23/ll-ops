name: Ansible Vault guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-vault-encryption:
    name: Verify required Ansible Vault encryption
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify protected files are encrypted
        run: python3 bin/check_ansible_vault_encryption.py

  scan-for-secrets:
    name: Scan repository for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
